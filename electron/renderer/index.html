<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M3U8 Downloader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>M3U8 다운로더</h1>
        <p class="subtitle">스트림 주소를 넣고 저장 위치를 고른 뒤 다운로드하세요.</p>
      </header>

      <section class="field">
        <label for="url">M3U8 URL</label>
        <input
          id="url"
          type="url"
          placeholder="https://example.com/playlist.m3u8"
          autocomplete="off"
          spellcheck="false"
        />
      </section>

      <section class="field">
        <label for="saveFolder">저장 폴더</label>
        <div class="row">
          <input
            id="saveFolder"
            type="text"
            readonly
            placeholder="찾아보기로 폴더 선택…"
          />
          <button type="button" id="browseBtn" class="btn secondary">
            찾아보기
          </button>
        </div>
      </section>

      <section class="actions">
        <button type="button" id="downloadBtn" class="btn primary">
          다운로드
        </button>
        <button type="button" id="cancelBtn" class="btn danger" disabled>
          중지
        </button>
      </section>

      <section class="status">
        <div id="statusText" class="status-text">준비됨</div>
        <div id="timeLine" class="time-line"></div>
        <pre id="logBox" class="log-box" aria-live="polite"></pre>
      </section>

      <footer class="footer">
        <button type="button" id="openFolderBtn" class="link" disabled>
          저장 폴더 열기
        </button>
      </footer>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
